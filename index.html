<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarjetas de ejemplo</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Poppins:wght@400;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="/main.css">
    <script type="module" src="./events.js"></script>
    <script type="module" src="/renderTarjeta.js"></script>
</head>

<body>


    <main class="ejemplo">

          <!-- Búsqueda de Pokémon -->
        <section>
            <h2>Buscar Pokémon</h2>
            <p>Escribe el nombre del Pokémon que quieres encontrar.</p>

            <form id="formularioBusqueda">
                <label for="inputPokemon">Nombre del Pokémon:</label>

                <input
                    type="text"
                    id="inputPokemon"
                    name="pokemon"
                    placeholder="Ejemplo: Pikachu"
                    autocomplete="off"
                >

                <button type="submit" id="btnBuscar">
                    Buscar
                </button>

                <button type="button" id="btnLimpiar">
                    Limpiar
                </button>
            </form>

            <!-- Mensaje para el usuario -->
            <div id="mensajeBusqueda" aria-live="polite">
                <h3>¡Comienza tu exploración!</h3>
                <p>Busca un Pokémon para conocer sus características.</p>
            </div>

            <!-- Aquí aparecerá el Pokémon encontrado -->
            <div id="resultadoBusqueda"></div>
        </section>





        <!-- Tarjetas favoritas -->
        <h2>Mis favoritos</h2>
        <div id="listaFavoritos"></div>

        <h1>Algunos pokemones</h1>

        <!-- Tarjetas generadas desde la API -->
        <div class="fila" id="container-tarjetas"></div>
        
    </main>

    

</body>

</html>
